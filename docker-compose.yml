services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      # Override the dev SQLite path so the DB lives on the named volume
      DATABASE_URL: sqlite:////app/db/fakestore.db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      FRONTEND_URL: http://localhost:3000
    volumes:
      - db-data:/app/db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      args:
        # Relative URL → nginx proxies /api/ to the server container
        REACT_APP_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
